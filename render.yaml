services:
  - type: web
    name: testora-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://testora.studio,https://www.testora.studio
      - key: FRONTEND_URL
        value: https://testora.studio
      - key: TRUSTED_PROXY_CIDRS
        value: 127.0.0.1/32,::1/128
      - key: APP_TIMEZONE
        value: Asia/Almaty
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FAST_MODEL
        value: gemini-2.5-flash
      - key: FREE_WRITING_SUBMISSIONS
        value: "2"
      - key: FREE_SPEAKING_SUBMISSIONS
        value: "2"
      - key: LOG_LEVEL
        value: INFO
