# Full Testora stack in Docker: Postgres + backend + frontend.
#
# Local run (mock grader, no secrets needed):
#   docker compose up --build            # http://localhost:3000, API on :8000
# Real Gemini grading:
#   AI_PROVIDER=gemini GEMINI_API_KEY=... docker compose up --build
# Optional local Qwen via Ollama (profile "qwen"; the backend wiring to
# AI_PROVIDER=qwen lands separately):
#   docker compose --profile qwen up --build
#   docker compose exec ollama ollama pull qwen2.5:7b-instruct
#
# Self-hosted production (NOT how testora.studio runs: that is Vercel + Render +
# Neon, see render.yaml): put real values in a .env next to this file (see
# .env.example), set APP_ENV=production and terminate TLS at a reverse proxy.
#
# SECURITY: `backend` and `frontend` ports bind to 127.0.0.1 only, so they are
# reachable solely from a reverse proxy on the same host. The auth rate-limiter
# trusts X-Forwarded-For only from TRUSTED_PROXY_CIDRS; set it to the proxy CIDR.
# Do not expose 0.0.0.0.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: testora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testora-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testora"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-testora-local}@db:5432/testora
      SECRET_KEY: ${SECRET_KEY:-local-dev-secret-change-me-0123456789abcdef}
      APP_ENV: ${APP_ENV:-development}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Almaty}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_FAST_MODEL: ${GEMINI_FAST_MODEL:-gemini-2.5-flash}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FREE_WRITING_SUBMISSIONS: ${FREE_WRITING_SUBMISSIONS:-2}
      FREE_SPEAKING_SUBMISSIONS: ${FREE_SPEAKING_SUBMISSIONS:-2}
      QUOTA_EXEMPT_USER_IDS: ${QUOTA_EXEMPT_USER_IDS:-}
      AI_DAILY_ATTEMPTS: ${AI_DAILY_ATTEMPTS:-20}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-http://ollama:11434/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen2.5:7b-instruct}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
    volumes:
      - audio:/app/private/audio_submissions
      # User-uploaded avatars are served from /app/static/avatars; keep them on a
      # named volume so they survive the container rebuild on every deploy.
      - avatars:/app/static/avatars
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

  # Optional local LLM server (OpenAI-compatible API at :11434/v1).
  ollama:
    image: ollama/ollama:latest
    profiles: ["qwen"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  ollama:
  pgdata:
  audio:
  avatars:
