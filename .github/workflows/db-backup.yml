name: Database backup

# DISABLED BY DEFAULT: runs only when started by hand from the Actions tab.
# To enable a nightly backup, uncomment the schedule below and add the
# repository secret DATABASE_URL (Settings > Secrets and variables > Actions):
# a Neon connection string, ideally for a read-only role, with sslmode=require.
# The dump is uploaded as a workflow artifact kept for 7 days. Anyone with read
# access to the repository can download artifacts, and the repo is public, so
# treat this as a stop-gap: it holds user data. Prefer running
# scripts/backup_prod.sh yourself and keeping the file encrypted off-site.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install matching pg_dump (client 17)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_DIR: ${{ runner.temp }}/backup
        run: sh scripts/backup_prod.sh

      - uses: actions/upload-artifact@v4
        with:
          name: testora-db-${{ github.run_id }}
          path: ${{ runner.temp }}/backup/*.dump.gz
          retention-days: 7
          if-no-files-found: error
