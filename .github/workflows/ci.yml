name: CI

on:
  push:
    branches: [main, "nurhan/**"]
  pull_request:

# A newer push to the same ref cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testora
          POSTGRES_PASSWORD: testora-ci
          POSTGRES_DB: testora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testora -d testora_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://testora:testora-ci@localhost:5432/testora_test
      TEST_POSTGRES_URL: postgresql://testora:testora-ci@localhost:5432/testora_test
      SECRET_KEY: ci-only-test-secret
      AI_PROVIDER: mock
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-ml.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-ml.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Alembic single-head check
        run: python -m scripts.dev.check_migration_heads

      - name: Apply and reverse security migrations on PostgreSQL
        run: |
          alembic upgrade head
          alembic downgrade h2c3d4e5f6a7
          alembic upgrade head

      - name: Alembic check (models match migrations)
        run: alembic check

      - name: Install media validator (ffprobe)
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ffmpeg
          version: 1.0

      - name: Validate reading content
        run: python -m content_tools.validate_reading

      - name: Validate Listening content and actual audio
        run: python -m content_tools.validate_listening --no-write-report

      - name: Validate Writing content
        run: python -m content_tools.validate_writing

      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  backend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image (no push)
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose config (defaults)
        run: docker compose config >/dev/null

      - name: Validate compose config (production-like variables, qwen profile)
        env:
          POSTGRES_PASSWORD: dummy
          SECRET_KEY: dummy
          APP_ENV: production
          AI_PROVIDER: gemini
          GEMINI_API_KEY: dummy
          CORS_ORIGINS: https://app.example.com
          NEXT_PUBLIC_API_URL: https://api.example.com
        run: docker compose --profile qwen config >/dev/null
